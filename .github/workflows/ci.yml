name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify

      - name: Run Go Unit Tests
        run: |
          go test -v -race ./...

      - name: Compile Static ProcSentry Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -v -o bin/procsentry ./cmd/procsentry
          ls -lh bin/procsentry
